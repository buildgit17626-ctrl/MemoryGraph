[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memorygraph-mvp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Synthetic memory relevance and retrieval demonstration"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
